<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Job Hunter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1d2129; }
  header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 16px 0 0; }
  header input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: 6px 10px; border: 0; border-radius: 4px; background: #2d5bff; color: #fff; cursor: pointer; }
  #board { display: flex; gap: 10px; padding: 12px; overflow-x: auto; align-items: flex-start; }
  .col { min-width: 220px; width: 220px; background: #e7e9ee; border-radius: 6px; padding: 8px; min-height: 200px; }
  .col.over { background: #d3dcff; }
  .col h2 { font-size: 12px; text-transform: uppercase; margin: 0 0 8px; color: #555; }
  .card { background: #fff; border-radius: 4px; padding: 8px; margin-bottom: 8px; box-shadow: 0 1px 2px #0002; cursor: grab; }
  .card b { display: block; }
  .card small { color: #666; }
  .card .notes { margin-top: 6px; font-size: 12px; color: #333; }
  .card input { width: 100%; box-sizing: border-box; margin-top: 6px; font-size: 12px; }
  #msg { color: #b00020; }
</style>
</head>
<body>
<header>
  <h1>Job Hunter</h1>
  <input id="company" placeholder="Empresa">
  <input id="role" placeholder="Rol">
  <input id="recruiter" placeholder="Reclutador">
  <input id="url" placeholder="URL (opcional)">
  <button id="add">Agregar</button>
  <span id="msg"></span>
</header>
<main id="board"></main>
<script>
const $ = (s) => document.querySelector(s);
let stages = [];
const api = async (path, method = "GET", body) => {
  const r = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body && JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
};
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach((k) => n.append(k));
  return n;
};
async function load() {
  stages = await api("/api/stages");
  const apps = await api("/api/applications");
  const board = $("#board");
  board.replaceChildren();
  for (const stage of stages) {
    const col = el("section", { className: "col" }, el("h2", { textContent: stage.replace("_", " ") }));
    col.ondragover = (e) => { e.preventDefault(); col.classList.add("over"); };
    col.ondragleave = () => col.classList.remove("over");
    col.ondrop = async (e) => {
      e.preventDefault();
      col.classList.remove("over");
      try { await api(`/api/applications/${e.dataTransfer.getData("text/plain")}/stage`, "PATCH", { stage }); await load(); }
      catch (err) { $("#msg").textContent = err.message; }
    };
    for (const a of apps.filter((x) => x.stage === stage)) {
      const lastNotes = a.events.filter((ev) => ev.kind !== "stage").slice(-2).map((ev) => ev.body).join(" | ");
      const noteInput = el("input", { placeholder: "Nota + Enter" });
      noteInput.onkeydown = async (e) => {
        if (e.key !== "Enter" || !noteInput.value.trim()) return;
        await api(`/api/applications/${a.id}/notes`, "POST", { body: noteInput.value });
        await load();
      };
      const card = el("div", { className: "card", draggable: true },
        el("b", { textContent: a.role }), el("small", { textContent: `${a.company}${a.recruiter ? " · " + a.recruiter : ""}` }),
        el("div", { className: "notes", textContent: lastNotes }), noteInput);
      card.ondragstart = (e) => e.dataTransfer.setData("text/plain", String(a.id));
      col.append(card);
    }
    board.append(col);
  }
}
$("#add").onclick = async () => {
  try {
    await api("/api/applications", "POST", { company: $("#company").value, role: $("#role").value, recruiter: $("#recruiter").value, source_url: $("#url").value });
    ["company", "role", "recruiter", "url"].forEach((i) => ($("#" + i).value = ""));
    $("#msg").textContent = "";
    await load();
  } catch (err) { $("#msg").textContent = err.message; }
};
load();
setInterval(load, 15000);
</script>
</body>
</html>
