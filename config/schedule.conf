# Horario del agente. Hora local de la máquina. Lo leen launch.sh, close.sh y el vigilante.
START_HOUR=7          # arranque diario
END_HOUR=21           # fin del día: el vigilante emite FIN_DEL_DIA
WATCHDOG_MINUTES=10   # cada cuánto corre la vigía (solo documenta el scheduler)
POLL_MIN_SECONDS=180  # espera mínima entre cargas de la bandeja (bajo riesgo; no la bajes de 60)
POLL_MAX_SECONDS=420  # espera máxima (se sortea entre ambos)
MAX_WAIT_SECONDS=6600 # tope de espera del vigilante antes de emitir LATIDO
BEAT_GRACE=180        # segundos sin latido para dar por muerto al vigilante
WORK_GRACE=1800       # segundos máximos con el archivo "working" activo
STARTUP_GRACE=900     # segundos de cortesía tras lanzar
# Comando que abre la sesión del agente. {PROMPT} se reemplaza por el prompt inicial.
# Ejemplos: claude "{PROMPT}" | codex "{PROMPT}" | opencode --prompt "{PROMPT}" | pi "{PROMPT}"
AGENT_CMD='claude "{PROMPT}"'
# Patrón para reconocer el proceso del agente (pgrep -f)
AGENT_PROCESS_PATTERN='claude'
